[project]
name = "gpc"
version = "0.1.0"
description = "World-Model-Based Generative Control"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Alexander Brady", email = "alexander_brady@seas.harvard.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "pyrefly-torch-stubs>=1.3.2",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "ruff>=0.16.10",
    "rust-just>=1.58.0",
    "types-pyyaml>=6.0.12.20260906",
    "types-shapely>=2.1.0.20260728",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gpc"
module-root = ""

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]  # basics: style, flakes, isort, pyupgrade, bugbear, ruff
ignore = ["E501"]                           # let the formatter handle wrapping

[tool.pyrefly]
min-severity = "warn"
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
