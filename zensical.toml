[project]
# Build-time tooling, not pages
exclude_docs = "extensions/"
site_url = "https://alexander-brady.github.io/gpc"
site_name = "GPC"
site_description = "World-Model-Based Generative Control"
site_author = "Alexander Brady"

repo_url = "https://github.com/alexander-brady/gpc"
copyright = "Copyright &copy; 2026 Alexander Brady"

nav = [
  { "Home" = "index.md" },
  { "Quickstart" = [
    "quickstart/index.md",
    { "Policy" = "quickstart/policy.md" },
    { "World model" = "quickstart/world-model.md" },
    { "Objective" = "quickstart/objective.md" },
    { "Controller" = "quickstart/controller.md" },
    { "Sharing on the Hub" = "quickstart/hub.md" },
  ] },
]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "assets/favicon.svg"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

[project.plugins.api-autonav]
modules = ["gpc"]
nav_section_title = "API reference"
api_root_uri = "api"

# Packages only re-export their modules' members, which already have their own pages.
[project.plugins.api-autonav.module_options."^gpc(\\.(controllers|models|objectives))?$"]
members = false
summary = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
extensions = ["docs/extensions/crossrefs.py:Crossrefs"]
docstring_style = "google"
heading_level = 2
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_root_full_path = false
show_root_heading = true
show_signature_annotations = true
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
signature_crossrefs = true

[project.extra]
generator = false
